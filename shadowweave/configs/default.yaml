seed: 0
deterministic: false

sim:
  room_size: 6.0          # meters, square room
  camera_height: 1.6      # meters
  camera_fov: 90          # degrees
  fps: 30
  difficulty: "static"    # static | moving | debris
  agent_max_speed: 0.1    # metres per physics step
  agent_max_turn_rate: 0.15  # radians per physics step
  max_episode_steps: 500
  agent_radius: 0.25      # metres — used for real geometric collision detection
  substeps: 3             # physics steps per env.step

depth:
  model: "depth-anything/Depth-Anything-V2-Small-hf"
  output_h: 128
  output_w: 128

shadow:
  num_rays: 512
  march_steps: 64
  march_step_size: 0.05   # meters per step
  grid_cells: 9           # 9 azimuth zones, 1-to-1 with the 9 audio directions
  density_threshold: 0.5  # ray termination threshold
  target_hz: 15
  max_range_m: 8.0        # depth 1.0 == this distance; FIXED so frames are comparable
  elevation_samples: 9    # rows of the depth map sampled per ray
  elevation_extent: 0.35  # +/- normalised image y covered by the elevation band
  zone_temperature: 0.5   # softmax temperature over zones; lower = sharper zones
  zone_init_sharpness: 6.0  # initial ray->zone logit scale

bev:
  size: 96                # S x S egocentric grid
  range_m: 5.0            # forward extent in metres; 8.0 in a 6m room put ~90% of
                          # the grid outside the walls and left it 91% shadow
  surface_thickness_m: 0.25   # width of the occupancy bump at the hit surface
  visibility_softness_m: 0.15 # sigmoid width of the free/shadow boundary
  depth_softmin_beta: 12.0    # sharpness of the soft-min over the elevation band
  input_channels: ["occupancy", "visibility", "flow"]  # world model input stack

world_model:
  architecture: "unet"    # unet | convlstm | diffusion

  # Conditional DDPM over future BEV occupancy. Motivation: BCE is mean-seeking, so
  # the deterministic model hedges into a grey smear exactly where the future is
  # multimodal — the shadow. Diffusion samples coherent futures instead.
  diffusion:
    timesteps: 1000       # training noise steps (cosine schedule)
    sample_steps: 50      # DDIM steps at inference; the main quality/latency knob
    ddim_eta: 0.0         # 0 = deterministic DDIM; >0 adds per-step stochasticity
    predict_samples: 4    # samples averaged by predict() for the posterior mean
    eval_samples: 8       # samples used for diversity/calibration reporting
  base_channels: 64
  depth_multiplier: 4
  prediction_horizons: [1, 3, 5, 10]  # seconds
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  epochs: 100
  bce_weight: 1.0
  physics_reg_weight: 0.1
  pos_weight: 6.0         # BCE positive-class weight; BEV targets are ~7% positive
  checkpoint_dir: "checkpoints/world_model"
  num_workers: 8
  amp: true               # mixed precision (CUDA only)
  compile: false          # torch.compile the model
  grad_clip: 1.0
  early_stop_patience: 15
  log_interval: 20
  ema: true               # validate and ship exponentially-averaged weights
  ema_decay: 0.999

agents:
  local:
    hidden_dim: 256
    num_layers: 3
    control_hz: 20
    ppo_lr: 3.0e-4
    ppo_gamma: 0.99
    ppo_clip: 0.2
    ppo_n_envs: 8
    ppo_n_steps: 512
    # "spawn" — a forked worker inherits MuJoCo's GL context and torch device state
    # and dies with an unexplained EOFError. Each worker rebuilds the world model, so
    # expect roughly (model size x ppo_n_envs) of extra RSS.
    ppo_start_method: "spawn"
    allow_random_world_model: false  # true = deliberately train/eval against an untrained world model
    reward_collision_weight: -10.0
    reward_efficiency_weight: 1.0
    reward_progress_weight: 5.0
    reward_shadow_weight: -0.5
    reward_audio_clarity_weight: -2.0
    reward_goal_bonus: 10.0   # one-off reward for reaching the goal (terminated)
    max_simultaneous_cues: 3
    checkpoint_dir: "checkpoints/local_agent"

  global:
    planning_hz: 2
    astar_heuristic_weight: 1.2
    astar_obstacle_cost: 10.0   # multiplier on occupancy when scoring a cell
    astar_shadow_cost: 2.0      # extra cost for routing through unobserved space
    astar_allow_diagonal: true
    astar_block_threshold: 0.9  # occupancy at/above this is impassable, not just expensive

  orchestrator:
    uncertainty_stop_threshold: 0.85

audio:
  sample_rate: 44100
  buffer_size: 1024
  hrtf_dataset: "mit_kemar"
  hrtf_dir: "data/kemar"
  zones:  # azimuth angles for 9 zones (degrees, 0=front, +ve=right)
    left_far:    -135
    left:        -90
    left_near:   -45
    front_left:  -22
    front:       0
    front_right: 22
    right_near:  45
    right:       90
    right_far:   135
  base_frequency: 200.0   # Hz, low ambient hum for shadow zones
  doppler_sweep_duration: 3.0  # seconds, falling-object cue
  min_intensity: 0.0
  max_intensity: 1.0
  cue_threshold: 0.1      # below this a zone stays silent (absence of cue = safe)
  falling_min_intensity: 0.6  # floor for falling-object cues — a visible (low-uncertainty) falling hazard must still be loud
  master_gain: 0.5

optical_flow:
  model: "raft_small"

data:
  root: "data/rollouts"
  steps_per_episode: 300
  train_episodes: 400
  val_episodes: 80
  compress: false         # uncompressed .npz so the loader can memory-map it
  policy: "explore"       # explore | random | straight — drives the camera during rollouts

eval:
  num_episodes: 100
  difficulty_tiers: ["static", "moving", "debris"]
  iou_horizon: 5          # seconds
  steps_per_episode: 200
  results_dir: "results"

wandb:
  project: "shadowweave"
  entity: null            # set to your wandb username
  mode: "offline"         # online | offline | disabled — offline records runs even on
                          # keyless/firewalled compute nodes; `wandb sync wandb/` after
